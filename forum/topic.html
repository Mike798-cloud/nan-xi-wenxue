<!doctype html><html lang="zh-CN" data-site="forum" data-site-label="南溪文学论坛"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>论坛主题 - 南溪文学论坛</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/forum.css"></head><body><a class="skip-link" href="#main">跳到正文</a><div class="forum-wrap"><header class="forum-head"><div class="top"><div><div class="forum-logo">南溪文学论坛</div><div class="forum-slogan">写作 · 阅读 · 南溪生活</div></div></div><nav class="forum-nav"><a href="../index.html">首页</a><a href="river.html">原创小说</a></nav></header><div class="crumb"><a href="../index.html">首页</a> › <span id="board-name">主题</span></div><main id="main" class="forum-main"><div class="thread" id="thread"></div></main><footer class="forum-foot"><a href="../index.html">返回论坛首页</a></footer></div><script src="../assets/js/forum-data.js"></script><script>
const p=new URLSearchParams(location.search),id=Number(p.get('id')||0),data=window.NANXI_FORUM_TOPICS.find(x=>x.id===id),box=document.getElementById('thread');
const avatars=['bookshelf.webp','rain-window.webp','bus-interior.webp','locust-window.webp','zine-desk.webp','reading-room.webp'];
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))} function pars(a){return a.map(x=>'<p>'+x+'</p>').join('')}
if(!data){box.innerHTML='<div class="empty-topic"><h2>主题未恢复</h2><p>这个编号在当前备份中没有正文。</p></div>'}else{document.title=data.title+' - 南溪文学论坛';document.getElementById('board-name').textContent=data.board;const av=avatars[data.id%avatars.length];box.innerHTML=`<article class="post"><aside class="poster"><strong>${esc(data.author)}</strong><div class="meta">${esc(data.board)}版会员</div><img class="avatar" src="../assets/images/${av}" alt="论坛用户头像"></aside><div class="post-body"><div class="post-head"><span>${esc(data.date)}</span><span>#1</span></div><div class="post-content"><h1 class="topic-heading">${esc(data.title)}</h1>${pars(data.body)}</div></div></article>`+data.comments.map((c,i)=>`<article class="post"><aside class="poster"><strong>${esc(c[0])}</strong><div class="meta">论坛会员</div></aside><div class="post-body"><div class="post-head"><span>${esc(c[1])}</span><span>#${i+2}</span></div><div class="post-content"><p>${c[2]}</p></div></div></article>`).join('')}
</script><script src="../assets/js/common.js"></script></body></html>
