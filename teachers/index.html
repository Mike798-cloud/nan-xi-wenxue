<div class="teach-wrap"><header class="teach-head"><h1>南溪教师交流站</h1><small>教研 · 班级管理 · 职称互助　旧站只读</small></header><nav class="teach-nav"><a href="index.html">首页</a><a href="index.html?t=班主任茶座">班主任茶座</a><a href="index.html?t=语文教研">语文教研</a><a href="index.html?t=职称互助">职称互助</a></nav><main id="main" class="teach-main"><section id="teach-content"></section><aside class="teach-side"><div class="block"><h3>版面公告</h3><ul><li>请勿公开学生完整姓名</li><li>家校纠纷请脱敏讨论</li><li>旧帖附件可能失效</li></ul></div><div class="block"><h3>热门话题</h3><ul><li>毕业班学生沟通</li><li>作文公开边界</li><li>教师跨区应聘</li></ul></div></aside></main><footer class="teach-foot">南溪教师交流站（虚构） · 注册用户历史公开发言只读</footer></div><script>const content=document.getElementById('teach-content'),p=new URLSearchParams(location.search),th=p.get('thread');if(th==='boundary'){content.innerHTML=`<p class="small"><a href="index.html">‹ 返回班主任茶座</a></p><div class="forum-box"><h2>学生和老师的边界，到底怎么掌握</h2></div><article class="thread-post"><div class="who">楼主：蒋老师　2007-10-23 22:17</div><div class="text"><p>最近校里有人把正常的课后辅导说得很难听。我不是说老师不能关心学生，但有些孩子本来就敏感，外面一议论，反而会伤到他们。大家碰到这种情况，是解释清楚，还是干脆拉开一点距离？</p></div></article><article class="thread-post"><div class="who">回复：槐树下　2007-10-24 00:03</div><div class="text"><p>不是孩子做错什么。就是有人开始说得难听。</p><p>他脾气不好，知道了大概又要跟人吵。</p><p>再几个月就毕业了，算了。</p><div class="sig">签名：槐树下 / 七中语文组　｜　周末常去 <a href="../bookshop/index.html" target="_blank">小满书店留言板</a><span class="external-mark">↗</span></div></div></article><article class="thread-post"><div class="who">回复：陈老师　2007-10-24 08:40</div><div class="text"><p>“算了”最省事，但孩子未必知道你在躲什么。要是直接把他推开，他大概率只会理解成自己做错了。</p></div></article><article class="thread-post"><div class="who">楼主　2007-10-24 12:15</div><div class="text"><p>同意。可现实里有时候解释本身也会让事情变大。</p></div></article>`}else{content.innerHTML=`<div class="forum-box"><h2>班主任茶座 · 主题列表</h2><div class="teach-row"><a href="index.html?thread=generic&t=%E7%8F%AD%E4%B8%BB%E4%BB%BB%E5%A6%82%E4%BD%95%E5%A4%84%E7%90%86%E5%AD%A6%E7%94%9F%E4%B9%8B%E9%97%B4%E7%9A%84%E5%8C%BF%E5%90%8D%E4%BC%A0%E8%A8%80">班主任如何处理学生之间的匿名传言</a><span>10</span><span>2007-01-01</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E5%85%AC%E5%BC%80%E8%AF%BE%E5%90%AC%E8%AF%BE%E8%AE%B0%E5%BD%95%E6%80%8E%E4%B9%88%E5%86%99%E6%9B%B4%E6%9C%89%E7%94%A8">公开课听课记录怎么写更有用</a><span>13</span><span>2007-02-02</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E9%AB%98%E4%B8%89%E5%AD%A6%E7%94%9F%E4%BD%9C%E6%96%87%E8%A6%81%E4%B8%8D%E8%A6%81%E5%85%AC%E5%BC%80%E5%BC%A0%E8%B4%B4">高三学生作文要不要公开张贴</a><span>16</span><span>2007-03-03</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E9%9D%92%E5%B9%B4%E6%95%99%E5%B8%88%E8%81%8C%E7%A7%B0%E6%9D%90%E6%96%99%E4%BA%92%E5%8A%A9">青年教师职称材料互助</a><span>19</span><span>2007-04-04</span></div><div class="teach-row"><a href="index.html?thread=boundary&t=%E5%AD%A6%E7%94%9F%E5%92%8C%E8%80%81%E5%B8%88%E7%9A%84%E8%BE%B9%E7%95%8C%EF%BC%8C%E5%88%B0%E5%BA%95%E6%80%8E%E4%B9%88%E6%8E%8C%E6%8F%A1">学生和老师的边界，到底怎么掌握</a><span>22</span><span>2007-05-05</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E6%99%9A%E8%87%AA%E4%B9%A0%E5%90%8E%E5%AD%A6%E7%94%9F%E4%BA%A4%E9%80%9A%E5%AE%89%E5%85%A8%E6%8F%90%E9%86%92">晚自习后学生交通安全提醒</a><span>25</span><span>2007-06-06</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E6%96%87%E5%AD%A6%E7%A4%BE%E7%AE%97%E4%B8%8D%E7%AE%97%E6%95%99%E5%AD%A6%E5%B7%A5%E4%BD%9C%E9%87%8F">文学社算不算教学工作量</a><span>28</span><span>2007-07-07</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E5%AE%B6%E9%95%BF%E4%BC%9A%E4%B8%8A%E6%9C%80%E9%9A%BE%E5%9B%9E%E7%AD%94%E7%9A%84%E9%97%AE%E9%A2%98">家长会上最难回答的问题</a><span>31</span><span>2007-08-08</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E5%AD%A6%E7%94%9F%E6%8B%92%E7%BB%9D%E5%8F%82%E5%8A%A0%E9%9B%86%E4%BD%93%E6%B4%BB%E5%8A%A8%E6%80%8E%E4%B9%88%E5%8A%9E">学生拒绝参加集体活动怎么办</a><span>34</span><span>2007-09-09</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E =%E6%80%8E%E6%A0%B7%E5%92%8C%E6%95%8F%E6%84%9F%E5%AD%A6%E7%94%9F%E8%A7%A3%E9%87%8A%E8%AF%AF%E4%BC%9A">怎样和敏感学生解释误会</a><span>64</span><span>2007-01-19</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E5%AD%A6%E7%94%9F%E6%AF%95%E4%B8%9A%E5%90%8E%E8%BF%98%E4%BF%9D%E6%8C%81%E8%81%94%E7%B3%BB%E5%90%97">学生毕业后还保持联系吗</a><span>67</span><span>2007-02-20</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E6%95%99%E7%A0%94%E7%BB%84%E5%9B%9B%E6%9C%88%E6%B4%BB%E5%8A%A8%E9%80%9A%E7%9F%A5">教研组四月活动通知</a><span>70</span><span>2007-03-21</span></div><div class="teach-row"><a href="index.html?thread=generic&t=%E7%8F%AD%E4%B8%BB%E4%BB%BB%E5%80%BC%E7%8F%AD%E8%A1%A8%E6%9B%B4%E6%96%B0">班主任值班表更新</a><span>73</span><span>2007-04-22</span></div></div>`}</script><script src="../assets/js/common.js"></script></body></html>
