<!doctype html><html lang="zh-CN" data-site="teachers" data-site-label="南溪教师交流站"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>南溪教师交流站</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/teachers.css"></head><body><a class="skip-link" href="#main">跳到正文</a><div class="teach-wrap"><header class="teach-head"><h1>南溪教师交流站</h1><small>教研 · 班级管理 · 职称互助　历史公开区</small></header><nav class="teach-nav"><a href="index.html">主题</a><a href="index.html?board=班主任茶座">班主任茶座</a><a href="index.html?board=语文教研">语文教研</a><a href="index.html?board=职称互助">职称互助</a></nav><main id="main" class="teach-main"><section><form class="archive-filter" id="filter"><label>年份<select id="year"><option value="">全部</option><option>2007</option><option>2008</option></select></label><label>版面<select id="board"><option value="">全部</option><option>班主任茶座</option><option>语文教研</option><option>职称互助</option></select></label><label>关键词<input id="kw" placeholder="标题或正文"></label><button>筛选旧帖</button></form><div id="teach-content"></div></section><aside class="teach-side"><div class="block"><h3>发帖提醒</h3><ul><li>学生信息请脱敏</li><li>家校纠纷勿贴电话</li><li>教研资料注明年级</li></ul></div><div class="block"><h3>常用版面</h3><ul><li>班主任茶座</li><li>语文教研</li><li>职称互助</li></ul></div></aside></main><footer class="teach-foot">南溪教师交流站（虚构）</footer></div><script>
const threads=[{"id":"boundary","year":"2007","board":"班主任茶座","title":"学生和老师的边界，到底怎么掌握","author":"蒋老师","date":"2007-10-23","body":["最近校里有人把正常的课后辅导说得很难听。我不是说老师不能关心学生，但有些孩子本来就敏感，外面一议论，反而会伤到他们。大家碰到这种情况，是解释清楚，还是干脆拉开一点距离？"],"replies":[["槐树下","不是孩子做错什么。就是有人开始说得难听。","他脾气不好，知道了大概又要跟人吵。再几个月就毕业了，算了。","签名：七中语文组 · 周末偶尔去 <a href=\"../bookshop/index.html\" target=\"_blank\">小满书店</a>"],["陈老师","“算了”最省事，但孩子未必知道你在躲什么。要是突然推开，他大概率只会理解成自己做错了。","",""],["蒋老师","现实里有时候解释本身也会让事情变大。现在想想，可能还是应该先把话说给当事人听。","",""]]},{"id":"rumor","year":"2007","board":"班主任茶座","title":"最近学校周边传言有点多","author":"一中李","date":"2007-09-18","body":["家长群、校门口、学生QQ空间，消息来得比老师快。最近两起明明很普通的事情被说得完全变形。"],"replies":[["蒋老师","越解释越像坐实，是最麻烦的地方。","",""]]},{"id":"essay","year":"2007","board":"语文教研","title":"学生作文公开张贴前要不要逐个确认","author":"刘雯","date":"2007-03-03","body":["以前习惯把优秀作文直接贴后墙，今年遇到学生很反感。是不是应该改成先征询？"],"replies":[["槐树下","应该。写得好不是自动获得公开许可。这个亏我吃过。","",""]]},{"id":"latebus","year":"2007","board":"班主任茶座","title":"晚自习后学生交通安全提醒","author":"陈老师","date":"2007-06-06","body":["城南方向末班车比较早，建议毕业班统计一下住得远的学生。"],"replies":[["槐树下","七中这边二十二路最麻烦。雨天绕行后更晚。","",""]]},{"id":"graduate","year":"2007","board":"班主任茶座","title":"学生毕业后还保持联系吗","author":"何老师","date":"2007-02-20","body":["带第一届毕业班，突然想到以后他们走了是不是就再也见不到。"],"replies":[["蒋老师","会有几个回来，也会有几年不联系突然在街上撞见的。别提前伤感。","",""]]},{"id":"career","year":"2008","board":"职称互助","title":"青年教师跨区应聘经验","author":"路老师","date":"2008-03-17","body":["想从学校转出版社或文化单位，有没有人走过这个流程？档案和试用期怎么处理？"],"replies":[["槐树下","我在问一家外地出版社，真走通了再回来写。","",""]]},{"id":"borrow","year":"2007","board":"语文教研","title":"办公室借书登记建议","author":"蒋老师","date":"2007-02-11","body":["学生来借书太多，经常一本找不到是谁拿走。准备放个登记本。"],"replies":[["槐树下","登记本最后会先丢。建议直接写名字夹书里。","",""]]},{"id":"workload","year":"2007","board":"语文教研","title":"文学社算不算教学工作量","author":"刘雯","date":"2007-07-07","body":["每周两次活动，校刊还要排版，但统计时基本当兴趣。大家学校怎么算？"],"replies":[["槐树下","我们算热爱。热爱不计课时。","",""]]},{"id":"parent","year":"2007","board":"班主任茶座","title":"家长会上最难回答的问题","author":"老田","date":"2007-08-08","body":["‘老师你觉得他以后能干什么’最难。我连自己以后干什么都不知道。"],"replies":[["蒋老师","就说先把这学期过完。成年人也一样。","",""]]},{"id":"punct","year":"2008","board":"语文教研","title":"作文批改量太大，有没有办法","author":"小路","date":"2008-02-15","body":["一晚上六十本，看到后来连逗号都像仇人。"],"replies":[["槐树下","不要跟逗号硬打，逗号胜率很高。","",""]]}],p=new URLSearchParams(location.search),box=document.getElementById('teach-content'),year=document.getElementById('year'),board=document.getElementById('board'),kw=document.getElementById('kw');year.value=p.get('year')||'';board.value=p.get('board')||'';kw.value=p.get('kw')||'';function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function list(){const k=kw.value.trim();let r=threads.filter(x=>{if(!year.value&&!board.value&&!k&&x.year!=='2008')return false;return(!year.value||x.year===year.value)&&(!board.value||x.board===board.value)&&(!k||[x.title,...x.body,...x.replies.flat()].join(' ').includes(k))});box.innerHTML=`<div class="forum-box"><h2>旧帖检索 <span>${r.length} 条</span></h2>${r.map(x=>`<div class="teach-row"><a href="index.html?thread=${x.id}">${esc(x.title)}</a><span>${x.board}</span><span>${x.date}</span></div>`).join('')||'<p class="empty">没有完全匹配，试试减少关键词。</p>'}</div>`}function show(id){const x=threads.find(t=>t.id===id);if(!x){list();return}box.innerHTML=`<p class="small"><a href="index.html">‹ 返回主题</a></p><div class="forum-box"><h2>${esc(x.title)}</h2><div class="thread-meta">${x.board} · ${x.date}</div></div><article class="thread-post"><div class="who">楼主：${x.author}</div><div class="text">${x.body.map(s=>'<p>'+s+'</p>').join('')}</div></article>`+x.replies.map(r=>`<article class="thread-post"><div class="who">回复：${r[0]}</div><div class="text"><p>${r[1]}</p>${r[2]?'<p>'+r[2]+'</p>':''}${r[3]?'<div class="sig">'+r[3]+'</div>':''}</div></article>`).join('')}document.getElementById('filter').addEventListener('submit',e=>{e.preventDefault();list();history.replaceState(null,'','?year='+encodeURIComponent(year.value)+'&board='+encodeURIComponent(board.value)+'&kw='+encodeURIComponent(kw.value))});p.get('thread')?show(p.get('thread')):list();
</script><script src="../assets/js/common.js"></script></body></html>
