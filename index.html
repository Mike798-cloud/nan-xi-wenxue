<script src="assets/js/forum-data.js"></script><script>
const rows=document.getElementById('board-body'),form=document.getElementById('forum-search'),q=document.getElementById('q'),note=document.getElementById('search-note'),params=new URLSearchParams(location.search);
const river={title:'《河水向南》连载帖（更新至第十三章）',author:'槐序',board:'原创小说',date:'2008-04-13',replies:386,href:'forum/river.html',search:'河水向南 槐序 陈禾 22路 二十二路 终点站'};
const june={title:'毕业以后第一次回来',author:'六月十一',board:'南溪生活',date:'2008-04-13',replies:0,href:'forum/june-20080413.html',code:'NX-18471'};
const deleted={title:'已删除主题记录：无标题',author:'槐序',board:'旧库索引',date:'2008-04-13 23:58',replies:'—',href:'forum/recovered.html',code:'NX-18472'};
const defaultIds=[1,4,5,6,7,10,12,14,17,18,23,31];
function textOf(o){return [o.title,o.author,o.date,o.board,...(o.body||[]),...(o.comments||[]).flat()].join(' ').toLowerCase()}
function boardMatch(x,b){if(!b)return true;if(b==='投稿')return x.board==='投稿';if(b==='随笔')return x.board==='随笔';if(b==='生活')return x.board==='生活';return x.board===b}
function exactFinal(term){const t=term.trim();return t==='NX-18471'||t==='18471'||t==='毕业以后第一次回来'||(t.includes('六月十一')&&t.includes('2008-04-13'))}
function exactDeleted(term){const t=term.trim().toUpperCase();return t==='NX-18472'||t==='18472'}
function render(){const term=q.value.trim(),t=term.toLowerCase(),b=params.get('board')||'';const all=window.NANXI_FORUM_TOPICS.map(x=>({...x,href:'forum/topic.html?id='+x.id}));let data;
if(!term){data=b?all.filter(x=>boardMatch(x,b)).slice(0,16):all.filter(x=>defaultIds.includes(x.id));if(!b)data.splice(2,0,river);}
else{data=all.filter(x=>(textOf(x)).includes(t));if((river.search||'').toLowerCase().includes(t))data.unshift(river);if(exactFinal(term))data.unshift(june);if(exactDeleted(term))data.unshift(deleted);}
data=data.filter(x=>boardMatch(x,b));
rows.innerHTML=data.map(x=>`<tr><td class="topic-title"><a href="${x.href}">${x.title}</a><div class="meta">${x.code?`主题编号 ${x.code}`:(x.id?'旧主题':'连载旧帖')}</div></td><td class="hide-mobile">${x.board}</td><td class="hide-mobile">${x.author}</td><td>${x.replies}</td><td class="hide-mobile">${x.date}</td></tr>`).join('');note.hidden=!(term||b);note.textContent=term?`搜索“${term}”：${data.length} 条匹配`:(b?`${b}：${data.length} 个主题`:'');}
form.addEventListener('submit',e=>{e.preventDefault();const next=new URLSearchParams(location.search);q.value?next.set('q',q.value):next.delete('q');history.replaceState(null,'','?'+next.toString());render();});if(params.get('q'))q.value=params.get('q');render();
</script><script src="assets/js/common.js"></script></body></html>
