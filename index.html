const rows=document.getElementById('board-body'),form=document.getElementById('forum-search'),q=document.getElementById('q'),note=document.getElementById('search-note'),params=new URLSearchParams(location.search);
const special=[{title:'《河水向南》连载帖（更新至第十三章）',author:'槐序',board:'原创小说',date:'2008-04-13',replies:386,href:'forum/river.html',search:'河水向南 槐序 陈禾 22路 二十二路 终点站 2008-04-13'},{title:'六月十一：毕业以后第一次回来',author:'六月十一',board:'南溪生活',date:'2008-04-13',replies:0,href:'forum/june-20080413.html',search:'六月十一 2008-04-13 毕业以后第一次回来 明天 去见 很久没见'}];
function textOf(o){return [o.title,o.author,o.date,o.board,...(o.body||[]),...(o.comments||[]).flat()].join(' ').toLowerCase()}
function boardMatch(x,b){if(!b)return true;if(b==='投稿')return x.board==='投稿';if(b==='随笔')return x.board==='随笔';if(b==='生活')return x.board==='生活';return x.board===b}
function render(){const term=q.value.trim(),t=term.toLowerCase(),b=params.get('board')||'';let data=window.NANXI_FORUM_TOPICS.map(x=>({...x,href:'forum/topic.html?id='+x.id}));data.splice(1,0,special[0]);data=data.filter(x=>boardMatch(x,b));if(t){data=data.filter(x=>(x.search||textOf(x)).toLowerCase().includes(t));if(boardMatch(special[1],b)&&special[1].search.toLowerCase().includes(t))data.unshift(special[1]);}
rows.innerHTML=data.map(x=>`<tr><td class="topic-title"><a href="${x.href}">${x.title}</a><div class="meta">${x.id?'主题编号 NX-'+String(19999+x.id):'连载/旧帖'}</div></td><td class="hide-mobile">${x.board}</td><td class="hide-mobile">${x.author}</td><td>${x.replies}</td><td class="hide-mobile">${x.date}</td></tr>`).join('');note.hidden=!(t||b);note.textContent=t?`搜索“${term}”：${data.length} 条匹配`:(b?`${b}：${data.length} 个主题`:'');}
form.addEventListener('submit',e=>{e.preventDefault();const next=new URLSearchParams(location.search);q.value?next.set('q',q.value):next.delete('q');history.replaceState(null,'','?'+next.toString());render();});if(params.get('q'))q.value=params.get('q');render();
</script><script src="assets/js/common.js"></script></body></html>
