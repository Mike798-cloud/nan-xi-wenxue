<!doctype html><html lang="zh-CN" data-site="publisher" data-site-label="江岸文艺出版社"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>江岸文艺出版社</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/publisher.css"></head><body><a class="skip-link" href="#main">跳到正文</a><div class="pub-shell"><div class="pub-utility"><span>江岸文艺出版社 · 2008旧版</span><span>总编室 / 文学编辑部 / 发行部</span><span>站内更新：2008-04-14</span></div><header class="pub-head"><div class="pub-logo">江岸文艺出版社</div><div class="pub-sub">JIANG'AN LITERATURE PRESS<br><b>文学 · 小说 · 随笔</b></div></header><nav class="pub-nav"><a href="index.html">首页</a><a href="index.html?page=books">图书</a><a href="index.html?page=submission">投稿 / 稿件查询</a><a href="index.html?page=jobs">招聘</a><a href="index.html?page=authors">作者</a></nav><div class="pub-banner"><div class="pub-banner-copy"><small>2008 SPRING / EDITORIAL</small><h2>文学从纸上开始，也从修改开始</h2><p>春季长篇小说选题会已结束。青年编辑招聘进入复试与材料确认阶段。</p></div></div><div class="pub-grid"><aside class="pub-side"><h3>栏目</h3><a href="index.html?page=books">2008新书</a><a href="index.html?page=submission">投稿须知</a><a href="index.html?page=jobs">编辑招聘</a><a href="index.html?page=authors">作者资料</a><a href="index.html?page=news">出版社动态</a></aside><main id="main" class="pub-main"><div id="pub-content"></div></main></div><footer class="pub-foot">江岸文艺出版社旧页（虚构）</footer></div><script>
const p=new URLSearchParams(location.search),box=document.getElementById('pub-content'),page=p.get('page')||'home';
const BOOKS=[
  {id:1,title:'夜航',author:'周既白',editor:'林简',date:'2008年1月',pages:'248页',price:'18.00元',isbn:'978-7-5306-4821-7',series:'江岸小说书系',blurb:'一九八九年的冬天，一艘往返江城与下游县镇的夜班客轮仍按旧时刻行驶。售票员、返乡青年、跑船多年的水手和一个带着纸箱上船的女人，在六个小时里各自守着一件不愿说出口的事。小说没有大起大落，只写夜色、水声和人在将要抵达之前短暂交会的时刻。',bio:'周既白，1974年生，湖北人。做过码头统计员、报社校对，现居江城。作品散见于《江岸》《长河文学》等刊。',recommend:'不是“船上奇遇”的故事，而是把夜路写得很慢。几个人物没有被强行拧成一个谜底，离船以后仍各自生活。',contents:['上船','二层舱','过七码头','凌晨一点','雾散以前','靠岸']},
  {id:2,title:'慢河',author:'冯书宁',editor:'许苇',date:'2008年2月',pages:'216页',price:'16.00元',isbn:'978-7-5306-4836-1',series:'散文随笔',blurb:'作者从县城一条并不起眼的支流写起，写沿河的菜市场、渡口、旧粮站、夏季涨水和冬天露出的石阶。二十七篇文章里没有“故乡赞歌”，更多是对日常变化的记录：一家铺子关门、一座桥改名、一个熟人搬走。',bio:'冯书宁，教师，长期居住在川南。九十年代开始写散文，曾获《西岭》年度散文奖。',excerpt:'“河慢，不是水真的慢。是站在岸上的人总以为明年还有同样的渡口。”'},
  {id:3,title:'纸城',author:'程雁',editor:'林简',date:'2008年2月',pages:'304页',price:'22.00元',isbn:'978-7-5306-4840-8',series:'青年长篇',blurb:'印刷厂排字工陈燕青在工厂改制后去了城南一家小广告公司。她每天替别人印喜帖、名片、欠条和开业横幅，却很少给自己留下什么。小说从一摞被退回的旧纸样开始，写城市如何在广告、表格和通知里一点点改名字。',bio:'程雁，1980年生，曾任印刷厂美工、广告文案。现居临江。',recommend:'语言干净，职业细节准确。编辑部讨论最多的一点，是作者没有把“旧行业消失”写成怀旧，而是写成继续生活。'},
  {id:4,title:'春汛',author:'罗仪',editor:'沈秋禾',date:'2008年3月',pages:'192页',price:'15.00元',isbn:'978-7-5306-4859-0',series:'江岸散文书系',blurb:'二十二篇短文，时间集中在每年三月至五月。雨水、堤坝、菜地、学校春游和第一次开窗睡觉的夜晚，构成一组很轻的季节记录。',bio:'罗仪，1968年生，水利系统职工。出版散文集《低处的风》。'},
  {id:5,title:'旧站台',author:'贺闻',editor:'许苇',date:'2008年3月',pages:'264页',price:'20.00元',isbn:'978-7-5306-4864-4',series:'江岸小说书系',blurb:'县城客运站搬迁前的最后七天，售票窗、行李房、小卖部和站外旅馆仍照常营业。有人来接人，有人来退票，也有人每天都坐在候车厅却从不上车。七个章节分别发生在同一座站房的不同角落。',bio:'贺闻，记者。长期从事社会新闻写作，短篇小说曾发表于《青年文学》。',contents:['星期一·售票窗','星期二·寄存处','星期三·小卖部','星期四·二号门','星期五·雨棚','星期六·候车厅','星期日·末班车']},
  {id:6,title:'半盏灯',author:'唐笙',editor:'沈秋禾',date:'2008年3月',pages:'180页',price:'15.00元',isbn:'978-7-5306-4869-9',series:'短篇小说',blurb:'十一篇短篇小说，人物多生活在小城夜晚仍亮着灯的地方：值班室、药店、理发店、旅馆前台、通宵面馆。作者关心的不是夜色，而是“有人必须留到最后”的工作。',bio:'唐笙，1977年生，安徽人。曾在医院行政部门工作，现为自由撰稿人。'},
  {id:7,title:'写作者',author:'江岸编辑部 编',editor:'编辑部',date:'2008年4月',pages:'328页',price:'24.00元',isbn:'978-7-5306-4873-6',series:'写作访谈',blurb:'十五位小说家、诗人、编辑与基层文学刊物主持人的长访谈。谈第一篇退稿、如何修改、怎样谋生，也谈写作之外的工作和家庭。不是“成功经验集”，保留了大量具体而琐碎的写作现场。',bio:'本书由江岸文艺出版社文学编辑部策划整理。受访者包括周既白、冯书宁、许晴川等。',recommend:'适合把文学当长期工作而不是“灵感”的读者。编辑部保留了一些受访者互相矛盾的意见，没有统一成写作方法。',contents:['第一辑：怎么开始','第二辑：怎么改','第三辑：怎么投稿','第四辑：写作以外']},
  {id:8,title:'南岸',author:'许晴川',editor:'林简',date:'2008年4月',pages:'276页',price:'21.00元',isbn:'978-7-5306-4879-8',series:'江岸小说书系',blurb:'年轻摄影师回到长江南岸处理父亲留下的一间照相馆。冲洗槽已经停用，柜台里却还压着几十张没人来取的照片。小说写的是归还：把照片还给陌生人，把钥匙还给房东，也把一些原以为属于自己的记忆放回原处。',bio:'许晴川，1982年生，摄影师、小说作者。现工作生活于成都与江城两地。',excerpt:'“照片背后没有日期。父亲以前说，真正来取照片的人不需要日期，他们一眼就知道那是哪一天。”'}
];
function bookCards(price=false){return '<div class="book-list">'+BOOKS.map((b,i)=>`<a class="book" href="index.html?page=book&id=${b.id}" aria-label="查看《${b.title}》图书资料"><img src="../assets/images/pub-cover-${i+1}.jpg" alt="《${b.title}》封面"><span class="book-name">《${b.title}》</span><span class="book-meta">${price?`定价 ${b.price}`:`${b.date}新书`}</span><span class="book-more">查看本书资料 ›</span></a>`).join('')+'</div>'}
function home(){box.innerHTML='<div class="pub-section-kicker">PUBLISHING NEWS</div><h1>出版社动态</h1><div class="pub-lead"><b>2008年度青年编辑招聘进入复试阶段。</b><span>长篇小说来稿请附完整目录与联系方式，电子稿与打印稿可任选其一。</span></div><h2>近期书目</h2>'+bookCards(false)}
function jobs(){box.innerHTML=`<h1>2008文字编辑招聘</h1><p>招聘2名。要求中文相关专业，本科以上，具备文学阅读与文字编辑能力。</p><h3>拟录用 / 复试</h3><table class="pub-table"><tr><th>姓名</th><th>来源</th><th>状态</th></tr><tr><td>顾槐</td><td>南溪第七中学</td><td>复试通过，待入职确认</td></tr><tr><td>陆明</td><td>《西岭》杂志</td><td>复试通过</td></tr><tr><td>谢青</td><td>自由撰稿</td><td>候补</td></tr></table><p>入职材料原定4月底前办理。</p>`}
function submission(){box.innerHTML=`<h1>投稿与稿件登记</h1><p>旧系统仅保留2008年前的稿件登记摘要。可按作者署名与稿件名组合查询。</p><form id="manu" class="manu-form"><label>作者 / 笔名<input id="ma" aria-describedby="ma-hint"><small id="ma-hint" class="field-hint">提示：实名或投稿时使用的笔名均可。</small></label><label>稿件名<input id="mt" aria-describedby="mt-hint"><small id="mt-hint" class="field-hint">提示：填写作品完整书名，不需要书名号。</small></label><button>查询</button></form><div id="manu-result"></div>`;document.getElementById('manu').onsubmit=e=>{e.preventDefault();const a=document.getElementById('ma').value.trim(),t=document.getElementById('mt').value.trim(),out=document.getElementById('manu-result');if((a.includes('槐序')||a.includes('顾槐'))&&t.includes('河水向南'))out.innerHTML=`<div class="manu-record"><h3>登记号 JA-080413-27</h3><table class="pub-table"><tr><th>署名</th><td>槐序（顾槐）</td></tr><tr><th>稿名</th><td>《河水向南》</td></tr><tr><th>文件</th><td>完整稿 17 项（正文16章 + 终章）</td></tr><tr><th>收件</th><td>2008-04-13 19:26</td></tr><tr><th>编辑备注</th><td>完整稿已收悉，等作者确认最终版。附件目录：正文16章，终章1项。</td></tr><tr><th>作者主页</th><td><a href="../blog/index.html" target="_blank">槐序 / 一棵树的背面</a></td></tr></table></div>`;else out.innerHTML='<p class="muted">没有完全匹配。旧登记要求作者与稿名至少各命中一项。</p>'}}
function books(){box.innerHTML='<div class="pub-section-kicker">NEW TITLES · 2008</div><h1>2008新书</h1><p>文学、散文、青年写作系列。以下为春季第一批书目，点击封面或书名可查看图书资料。</p>'+bookCards(true)}
function bookDetail(){const id=Number(p.get('id')),b=BOOKS.find(x=>x.id===id);if(!b){books();return}const extra=[];if(b.recommend)extra.push(`<section class="book-extra"><h2>编辑推荐</h2><p>${b.recommend}</p></section>`);if(b.contents)extra.push(`<section class="book-extra"><h2>目录选摘</h2><ol class="book-contents">${b.contents.map(x=>`<li>${x}</li>`).join('')}</ol></section>`);if(b.excerpt)extra.push(`<section class="book-extra"><h2>书中一页</h2><blockquote>${b.excerpt}</blockquote></section>`);box.innerHTML=`<div class="pub-breadcrumb"><a href="index.html">首页</a> &gt; <a href="index.html?page=books">2008新书</a> &gt; 《${b.title}》</div><article class="book-detail"><div class="book-detail-top"><div class="book-cover-large"><img src="../assets/images/pub-cover-${b.id}.jpg" alt="《${b.title}》封面"><div>江岸文艺出版社 · ${b.date}</div></div><div class="book-facts"><div class="pub-section-kicker">BOOK INFORMATION</div><h1>《${b.title}》</h1><p class="book-byline">${b.author} 著</p><table class="pub-table book-fact-table"><tr><th>责任编辑</th><td>${b.editor}</td></tr><tr><th>出版时间</th><td>${b.date}</td></tr><tr><th>页数</th><td>${b.pages}</td></tr><tr><th>定价</th><td>${b.price}</td></tr><tr><th>书系</th><td>${b.series}</td></tr><tr><th>ISBN</th><td>${b.isbn}</td></tr></table></div></div><section class="book-extra"><h2>内容简介</h2><p>${b.blurb}</p></section><section class="book-extra"><h2>作者简介</h2><p>${b.bio}</p></section>${extra.join('')}<div class="book-return"><a href="index.html?page=books">‹ 返回2008新书书架</a></div></article>`}
function authors(){box.innerHTML='<h1>作者资料</h1><p>作者页面按正式出版物建档。尚未正式出版的来稿作者不单独建立公开资料页。</p><p class="muted">已出版作者的简要资料，可从各书目的“图书资料”页面查看。</p>'}
function news(){box.innerHTML='<h1>出版社动态</h1><p>4月：春季选题会结束。</p><p>3月：青年文字编辑招聘启动。</p>'}
({home,jobs,submission,books,book:bookDetail,authors,news}[page]||home)();
</script><script src="../assets/js/common.js"></script></body></html>
