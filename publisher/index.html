<div class="pub-shell"><header class="pub-head"><div class="pub-logo">江岸文艺出版社</div><div class="pub-sub">JIANGAN LITERATURE PRESS · 2008旧版</div></header><nav class="pub-nav"><a href="index.html">首页</a><a href="index.html?page=books">图书</a><a href="index.html?page=submission">投稿</a><a href="index.html?page=jobs">招聘</a><a href="index.html?page=authors">作者</a></nav><div class="pub-banner"><h2>让好文字走得比作者更远一点</h2><p class="small">小说 · 散文 · 文艺评论 · 地方写作</p></div><main id="main" class="pub-grid"><aside class="pub-side"><h3>信息栏目</h3><a href="index.html?page=news">出版社动态</a><a href="index.html?page=books">2008新书</a><a href="index.html?page=submission">投稿须知</a><a href="index.html?page=jobs">编辑招聘</a><a href="index.html?page=editor">编辑手记</a></aside><section class="pub-main" id="pub-content"></section></main><footer class="pub-foot">江岸文艺出版社旧网站（虚构） · 本页不对应任何现实机构</footer></div><script>const p=new URLSearchParams(location.search),page=p.get('page')||'home',c=document.getElementById('pub-content');const books=`<h1>近期书目</h1><div class="book-list"><div class="book"><div class="cover">江岸小说选·2007</div>江岸小说选·2007</div><div class="book"><div class="cover">小城散文十家</div>小城散文十家</div><div class="book"><div class="cover">河流与旧街</div>河流与旧街</div><div class="book"><div class="cover">纸上南方</div>纸上南方</div><div class="book"><div class="cover">木窗</div>木窗</div><div class="book"><div class="cover">夜班车</div>夜班车</div><div class="book"><div class="cover">沿江短篇</div>沿江短篇</div><div class="book"><div class="cover">三月刊精选</div>三月刊精选</div></div>`;if(page==='jobs')c.innerHTML=`<h1>文学编辑招聘（2008春季）</h1><p>招聘小说、散文编辑各一名。要求本科以上，有文字编辑、校刊、报刊或相关工作经验。能够独立审稿、校对，与作者沟通修改意见。</p><p><b>工作地点：</b>临江市。<br><b>材料：</b>简历、代表文字或编辑样稿。</p><div class="editor-note"><b>招聘状态：</b>4月上旬已完成面谈，拟录用人员正在办理入职材料。顾姓应聘者另交了一部长篇样稿，已按常规投稿流程登记。<a href="index.html?page=submission">查看投稿与稿件登记说明</a></div>`;else if(page==='submission')c.innerHTML=`<h1>投稿须知</h1><p>长篇请寄完整稿，不接受仅凭梗概立项。编辑部收到完整稿后会登记篇目数与字数，修改稿须注明版本。</p><div class="editor-note"><b>编辑部工作便笺（2008-04-13）：</b><br>作者“槐序”《河水向南》完整稿已收悉，目录为17项（含终章），打印校样齐。尚缺作者最终确认与通讯地址变更表。<br><span class="muted">论坛公开连载目录目前仅13章，因此仍有未公开章节。</span><p>作者在材料里留了个人博客作为临时联系方式：<a href="../blog/index.html" target="_blank">槐序 / 一棵树的背面</a><span class="external-mark">↗</span></p></div>`;else if(page==='editor')c.innerHTML=`<h1>编辑手记</h1><p>长篇编辑最怕两种情况：作者没写完，或者作者写完以后自己又不肯交。最近一篇稿子属于第三种——稿子到了，人还在搬家。</p><p>相关稿件请按投稿登记页中的临时联系方式处理。</p>`;else if(page==='books')c.innerHTML=books;else c.innerHTML=`<h1>出版社动态</h1><p>四月编辑招聘面谈结束；春季长篇征稿继续接收。</p>${books}<div class="editor-note"><a href="index.html?page=submission">查看投稿须知与近期稿件登记说明</a></div>`;</script><script src="../assets/js/common.js"></script></body></html>
