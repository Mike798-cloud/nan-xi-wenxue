<!doctype html><html lang="zh-CN" data-site="writers" data-site-label="南溪作家论坛"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>南溪作家论坛</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/writers.css"></head><body><a class="skip-link" href="#main">跳到正文</a><div class="writers-wrap"><div class="writers-utility"><span>南溪写作者交流站 · 旧站存档</span><span>2008.04 / 第42周</span><span>公开区主题 2,184</span></div><header class="writers-head"><h1>南溪作家论坛</h1><p>写作交流 / 投稿信息 / 编辑招聘　2005—2010旧站</p><div class="writers-rule"><span>创作</span><span>投稿</span><span>活动</span><span>招聘</span></div></header><nav class="writers-nav"><a href="index.html">公开区</a><a href="index.html?view=search">搜索</a><a href="index.html?view=member">会员旧档</a></nav><main id="main" class="writers-main"><div id="writers-content"></div></main><footer class="writers-foot">南溪作家论坛（虚构）</footer></div><script>
const publicThreads=[{"id":"recruit","date":"2008-04-12","title":"编辑岗位：江岸文艺出版社招聘文字编辑","author":"白砚","board":"招聘","body":["把纸质招聘启事打成文字，方便外地朋友看。岗位两名，中文相关专业优先，要做样稿校对。","复试在临江，路费自理。不是替出版社招人，别给我投简历。"],"replies":[["老汪","工资呢？"],["白砚","启事没写。最重要的地方永远不写。"],["槐序","谢谢。已经投过。"]]},{"id":"fee","date":"2008-04-10","title":"地方刊物稿费结算太慢怎么办","author":"沉钟","board":"投稿","body":["去年十一月的稿费还没到，编辑每次都说下个月。继续问显得催，不问又怕忘。"],"replies":[["眠山","问。稿费不是压岁钱，不靠自觉。"],["槐序","邮件留着。三个月以后直接把刊期和篇名一起发。"]]},{"id":"ending","date":"2008-04-07","title":"写长篇到底要不要先写结尾","author":"眠山","board":"创作","body":["写到七万字，发现自己不知道最后让人物去哪。有人先写结尾再往前填吗？"],"replies":[["槐序","我先知道他会回来，至于回来以后做什么，写到那里再说。"],["老汪","这跟买返程票不定酒店差不多。"]]},{"id":"salon","date":"2008-03-30","title":"南溪四月小型沙龙报名","author":"宋宁","board":"活动","body":["四月第一个周日下午，两点，小满书店二楼。主题是“写熟悉的人”。最多十二个，凳子不够自己拿。"],"replies":[["小满","楼上只有十把椅子。"],["宋宁","那就最多十个。"],["槐序","我晚一点。"]]},{"id":"switch","date":"2008-03-28","title":"教师转编辑，有走过流程的吗","author":"槐序","board":"招聘","body":["教书第四年，想换个地方。不是出什么大事，就是越来越觉得自己更适合改稿，不适合每天站讲台。","档案、试用期和离职手续有人走过吗？"],"replies":[["白砚","学校放人最慢的是档案，不是人。"],["眠山","你终于承认想走。"],["槐序","我只承认问流程。"]]},{"id":"youth","date":"2008-03-21","title":"青年作者小辑征稿","author":"河岸","board":"投稿","body":["本刊六月做青年作者小辑，短篇八千字以内，散文五千字以内。邮件标题请写“青年小辑+姓名”。"],"replies":[["阿梨","学生可以吗？"],["河岸","可以，稿子能看就行。"]]},{"id":"photos","date":"2008-03-15","title":"旧书店交换活动照片","author":"小满","board":"活动","body":["上周旧书交换的照片洗出来了。有人闭眼，有人把《尤利西斯》拿反。照片在店里，想拿原片自己带U盘。"],"replies":[["老汪","拿反的是谁？"],["小满","你。"],["老汪","删帖。"]]},{"id":"local","date":"2008-03-08","title":"关于“地方性”三个字","author":"老汪","board":"创作","body":["编辑说我写得“有地方性”，不知道是夸还是委婉说不好卖。是不是写了江、老街、方言就算地方性？"],"replies":[["槐序","地方不是道具。你让人物知道哪家面涨价、哪路车下雨会晚，比写十遍江有用。"],["眠山","同意。"]]},{"id":"real","date":"2008-02-27","title":"小说里写现实人物的边界","author":"槐序","board":"创作","body":["改职业、改名字、改家庭以后，认识的人还是可能看出来。我的办法是让角色做一件现实里没发生过的选择。","只换姓名不算虚构，那叫不敢署名。"],"replies":[["眠山","本人看出来怎么办？"],["槐序","先看我有没有把他写坏。"],["白砚","这回答很危险。"]]}],p=new URLSearchParams(location.search),box=document.getElementById('writers-content');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function home(){box.innerHTML=`<div class="writers-columns"><section><h2>公开主题</h2><table class="writers-table"><tr><th>日期</th><th>主题</th><th>作者</th><th>版面</th></tr>${publicThreads.map(x=>`<tr><td>${x.date}</td><td><a href="index.html?view=public&id=${x.id}">${x.title}</a></td><td>${x.author}</td><td>${x.board}</td></tr>`).join('')}</table></section><aside class="member-box"><h3>会员旧档</h3><p>2008年前的“会员往来”区在迁移后需要原账号验证，公开区不受影响。</p><a href="index.html?view=member">旧账号验证</a></aside></div>`}
function search(){box.innerHTML=`<section class="writer-search"><h2>公开区搜索</h2><form id="ws"><input id="wq" placeholder="主题、作者或正文"><button>搜索</button></form><div id="wr"></div></section>`;const form=document.getElementById('ws'),q=document.getElementById('wq'),out=document.getElementById('wr');form.onsubmit=e=>{e.preventDefault();const t=q.value.trim();const r=t?publicThreads.filter(x=>[x.title,x.author,x.board,...x.body,...x.replies.flat()].join(' ').includes(t)):publicThreads;out.innerHTML=r.map(x=>`<p><a href="index.html?view=public&id=${x.id}">${x.title}</a> <span class="wmeta">${x.date} · ${x.author}</span></p>`).join('')||'<p class="muted">没有匹配。</p>'}}
function publicThread(id){const x=publicThreads.find(t=>t.id===id);if(!x){home();return}box.innerHTML=`<p class="small"><a href="index.html">‹ 返回公开区</a></p><article class="writer-thread"><h2>${esc(x.title)}</h2><p class="wmeta">${x.author} · ${x.date} · ${x.board}</p>${x.body.map(v=>'<p>'+v+'</p>').join('')}${x.replies.map(r=>`<div class="wpost"><b>${r[0]}：</b>${r[1]}</div>`).join('')}</article>`}
function login(){if(sessionStorage.getItem('nanxi:writers-auth')==='1'){member();return}box.innerHTML=`<section class="login-panel"><h2>会员旧档验证</h2><p>原密码库未迁移。旧账号通过注册时保留的安全问题核对身份。</p><form id="login"><label>登录名<input id="user" autocomplete="off" aria-describedby="user-hint"><small id="user-hint" class="field-hint">提示：填写她在南溪文学论坛长期使用的笔名。</small></label><label>安全问题：你最常坐哪一路公交？<input id="answer" autocomplete="off" placeholder="格式：数字+路" aria-describedby="answer-hint"><small id="answer-hint" class="field-hint">提示：旧资料要求填写注册者常乘的公交线路。只填线路名，不要加“公交”二字。</small></label><button>核对</button><div id="login-msg" class="login-msg"></div></form></section>`;document.getElementById('login').onsubmit=e=>{e.preventDefault();const u=document.getElementById('user').value.trim(),a=document.getElementById('answer').value.trim().replace(/公交/g,'');if(u==='槐序'&&(a==='22路'||a==='二十二路')){sessionStorage.setItem('nanxi:writers-auth','1');member()}else document.getElementById('login-msg').textContent='资料不匹配。旧账号不会因核对失败被锁定。'}}
function member(){box.innerHTML=`<div class="member-head"><h2>会员：槐序　/　旧档可读</h2><p>迁移时间：2010-08-19。私信正文未保存，仅恢复该账号在会员区公开给注册用户的主题。这里的内容主要是工作、投稿和搬家，不与南溪文学论坛同步显示。</p></div><div class="member-grid"><article><h3><a href="index.html?view=memberthread&id=job">想换个地方工作，出版社编辑岗有人了解吗</a></h3><div>2008-03-28 · 18回复</div><p>教师转编辑、档案、试用期。</p></article><article><h3><a href="index.html?view=memberthread&id=ending">长篇收尾后先给谁看</a></h3><div>2008-04-06 · 11回复</div><p>写完以后先让一个熟人挑错字。</p></article><article><h3><a href="index.html?view=memberthread&id=move">搬家前清理书和稿子</a></h3><div>2008-04-11 · 7回复</div><p>外地入职预计四月底，纸稿只留完整长篇。</p></article></div>`}
function mthread(id){if(sessionStorage.getItem('nanxi:writers-auth')!=='1'){login();return}const data={job:`<h2>想换个地方工作，出版社编辑岗有人了解吗</h2><p class="wmeta">槐序 · 2008-03-28</p><p>教书第四年，想换个地方。不是出什么事，就是越来越觉得自己更适合改稿，不适合每天站讲台。</p><p>看到江岸文艺出版社招文字编辑，有没有了解档案转接和试用期的？</p><div class="wpost"><b>眠山：</b>他们这批招两个人，要求有文学刊物经验。你够。</div><div class="wpost"><b>槐序：</b>已经投了。别替我立旗。</div><div class="wpost"><b>白砚：</b>启事还在：<a href="../publisher/index.html?page=jobs" target="_blank">江岸文艺出版社 / 人才招聘</a></div>`,ending:`<h2>长篇收尾后先给谁看</h2><p class="wmeta">槐序 · 2008-04-06</p><p>终于快写完。编辑当然要看，但有个人以前总嫌我写得慢，想先让他挑一个错别字。</p><div class="wpost"><b>眠山：</b>这算报复？</div><div class="wpost"><b>槐序：</b>算验收。</div>`,move:`<h2>搬家前清理书和稿子</h2><p class="wmeta">槐序 · 2008-04-11</p><p>月底如果手续顺利就走。书送一半，纸稿只留《河水向南》完整稿。最后几章还没贴论坛，先打印一份。</p><div class="wpost"><b>宋宁：</b>终于舍得离开学校。</div><div class="wpost"><b>槐序：</b>只是换一种眼疼。</div>`};box.innerHTML='<p class="small"><a href="index.html?view=member">‹ 返回会员旧档</a></p><article class="writer-thread">'+(data[id]||'<p>该主题未恢复。</p>')+'</article>'}
const v=p.get('view');if(v==='member')login();else if(v==='memberthread')mthread(p.get('id'));else if(v==='public')publicThread(p.get('id'));else if(v==='search')search();else home();
</script><script src="../assets/js/common.js"></script></body></html>
