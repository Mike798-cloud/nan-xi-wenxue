<!doctype html><html lang="zh-CN" data-site="blog" data-site-label="一棵树的背面"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>一棵树的背面 - 槐序</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/blog.css"></head><body><a class="skip-link" href="#main">跳到正文</a><div class="blog-overlay"><div class="blog-wrap"><header class="blog-head"><h1>一棵树的背面</h1><p>槐序的博客。写字，教书，坐车，偶尔做坏一顿饭。</p></header><nav class="blog-nav"><a href="index.html">首页</a><a href="#archive">归档</a><a href="#links">常用链接</a></nav><div class="blog-grid"><main id="main"><div id="blog-content"></div></main><aside class="blog-side"><h3>关于</h3><p class="small">槐序 / 南溪<br>语文老师<br>邮箱：h***@163.com</p><h3 id="archive">归档</h3><div class="blog-archive" id="archive-links"></div><h3 id="links">常用链接</h3><ul><li>南溪文学论坛</li><li>江岸文艺出版社</li><li>青石图文快印</li><li>小满书店</li></ul></aside></div><footer class="blog-foot">旧博客镜像（虚构）</footer></div></div><script>
const posts=[["2008-04-13","今天总算写完","《河水向南》最后四项今天收干净了。发给江岸那边一份，自己留一份纸稿。明早去<a href='../printshop/index.html' target='_blank'>青石图文</a>取打印件。文件名我终于从“终稿2”改回《河水向南_终稿》。\n\n月底如果手续顺利就搬，书先送掉两箱。厨房那口锅不带，煎蛋永远粘。\n\n有个人以前总说我写长东西磨叽。等见面的时候再让他自己挑错字。"],["2008-04-12","箱子还是不够","搬家最讨厌的是发现自己拥有很多从来不用的东西：五个茶杯、三把坏伞、十几本重复的校刊。\n\n留下2006秋和2007春。别的送小满。"],["2008-04-10","又坐过站","二十二路绕行还没恢复。我低头看三页稿子，醒过神已经过桥。怪司机没有用，站名自己不会走。"],["2008-04-08","逗号赢了","昨晚改到两点。今天上课把“标点”说成“终点”，全班笑。\n\n我决定今晚十点前关电脑。现在十点十三。"],["2008-04-04","小满书店","去拿《收获》，顺便碰见一个以前文学社的人。她问我是不是真的要走。我说还没签字。\n\n她说你每次都把确定的事说得像天气预报。"],["2008-03-29","槐花还没开","书店要拍海报问我哪里槐花多。我第一反应还是七中操场。想起去年六月毕业照地上全是花。可能月份记错了。"],["2008-03-18","做饭失败记录","鸡蛋一面糊一面生。有人能把这种东西稳定做坏四年，也算一种技术。"],["2008-03-03","复试回来","临江比南溪大很多，出版社楼下有三家面馆。复试问为什么想离开学校，我说想改稿。没说其实改学生作文也算改稿，只是要顺便管迟到、值日和头发。"],["2008-02-28","备课第四遍","同一篇课文讲第四遍，已经不知道是作者更烦还是我更烦。\n\n今天一个学生问“作者表达什么思想感情”，我差点说想下课。"],["2008-02-12","旧书","整理抽屉翻到一张被修正带盖过的作文批语。对着灯还能看见一点红。没必要留，还是夹回去了。"],["2008-01-20","冬天的车窗","公交窗上全是雾。有人擦一块看外面，过一会儿又白。大概很多事情只需要偶尔看清一下。"],["2007-12-29","年末","今年没什么总结。课照上，稿照退，饭照糊。文学社换人以后我的星期三空了，反而总觉得忘了什么。"],["2007-11-02","办公室很安静","高三晚自习以后办公室突然空很多。以前总有人来借书、交稿、吵一个标点。现在只剩热水器响。安静也挺吵。"],["2007-09-05","开学","换了座位，换了课表，也换了文学社指导。有人觉得我突然轻松了。其实只是少了一串钥匙。"],["2007-06-12","毕业照","昨天拍毕业照。总有人在快门落下时往别处看。照片洗出来以后，这种人反而最像那一秒真的活着。"]],p=new URLSearchParams(location.search),box=document.getElementById('blog-content'),arc=document.getElementById('archive-links');arc.innerHTML=posts.map(x=>`<a href="index.html?post=${x[0]}">${x[0]}</a>`).join('');function render(){const id=p.get('post'),data=id?posts.filter(x=>x[0]===id):posts.slice(0,5);box.innerHTML=data.map(x=>`<article class="blog-post"><h2><a href="index.html?post=${x[0]}">${x[1]}</a></h2><div class="bmeta">${x[0]}</div>${x[2].split('\n\n').map(t=>'<p>'+t+'</p>').join('')}</article>`).join('')}render();
</script><script src="../assets/js/common.js"></script></body></html>
