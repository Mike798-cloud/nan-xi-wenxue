<!doctype html><html lang="zh-CN" data-site="blog" data-site-label="槐序个人博客"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>一棵树的背面 - 槐序的博客</title><link rel="stylesheet" href="../assets/css/common.css"><link rel="stylesheet" href="../assets/css/blog.css"></head><body><a class="skip-link" href="#main">跳到正文</a>
<div class="blog-overlay"><div class="blog-wrap"><header class="blog-head"><h1>一棵树的背面</h1><p>槐序的个人博客　//　写书、上课、坐车、偶尔把饭做坏</p></header><nav class="blog-nav"><a href="index.html">首页</a><a href="#archive">归档</a><a href="#links">链接</a></nav><main id="main" class="blog-grid"><section id="blog-content"></section><aside class="blog-side"><h3>关于我</h3><p class="small">槐序。教语文。写得慢。</p><h3 id="archive">文章归档</h3><div class="blog-archive" id="archive-links"></div><h3 id="links">链接</h3><ul><li>南溪文学论坛</li><li>小满书店</li><li><a href="../printshop/index.html" target="_blank">青石打印店</a><span class="external-mark">↗</span></li></ul></aside></main><footer class="blog-foot">博客最后更新：2008-04-13 23:46 · 旧页面恢复</footer></div></div><script>const posts=[["2008-04-13", "今天总算写完", "《河水向南》最后几章改完。下午去青石打印店打了一份，顾姓，13号晚，文件名没改，还是“河水向南”。老板嫌我页码乱，我说反正是给一个特别会挑毛病的人看。明天见到他，让他先挑。", "copier.webp"], ["2008-04-12", "纸箱", "搬家最麻烦的是书。扔哪本都觉得对不起它，不扔又对不起腰。", "bookshelf.webp"], ["2008-04-10", "工作", "临江那边基本定了。问我什么时候能到，我说先把学校这边交完，再把一篇拖太久的东西收掉。", "teacher-office.webp"], ["2008-04-07", "槐花还没开", "楼下那棵树今年慢。可能因为雨太多，也可能树根本不在乎论坛里有人等它。", "locust-window.webp"], ["2008-04-03", "又坐过站", "我今天又坐过站了。怪司机没有用，站名自己不会走。", "bus-interior.webp"], ["2008-03-28", "锅", "煎蛋失败。一个破，另一个粘锅。决定以后写作时不写人做饭，容易露怯。", ""], ["2008-03-18", "要不要走", "有时候换工作不是因为现在多糟，只是想试试别的日子。", "nanxi-dusk.webp"], ["2008-03-09", "一本旧刊", "小满说有人把我发过东西的旧刊全买走了。希望不是拿去垫桌脚。", "literary-magazines.webp"], ["2008-02-27", "投简历", "第一次给出版社投的不是小说，是简历。比投稿还难写。", ""], ["2008-02-13", "办公室", "年轻老师把茶杯买成一样，我拿错两次。第三次干脆喝了。", "teacher-office.webp"], ["2008-01-22", "旧电影院封了", "站门口看了一会。其实也没什么值得看的，就是门上多了块铁皮。", "nanxi-dusk.webp"], ["2007-12-31", "年末", "今年没完成的事比完成的多。正常。", ""], ["2007-11-06", "话说重了", "今天想起一句以前说过的话。“以后别来办公室找我了。”当时觉得越短越不容易出事。后来才发现短话也可以伤人。", "corridor.webp"], ["2007-10-24", "很难解释的事", "最糟的不是有人误会，是你一解释，就等于把那些难听的话递给本来不知道的人看。", ""], ["2007-09-04", "新学期", "不带文学社了。轻松一点，也空一点。", "classroom.webp"], ["2007-06-11", "毕业", "合影时有人又站最边上。叫他，他没回头。脾气还是那么坏。", "literary-club.webp"], ["2007-04-20", "医院门口的面", "十八块。贵得离谱。还好病号没吃完。", ""], ["2006-11-09", "是我不对", "没先问就把学生作文贴出去了。他当场撕下来。我第一反应是生气，第二反应才想起来他没错。", "zine-desk.webp"]];const c=document.getElementById('blog-content'),a=document.getElementById('archive-links'),p=new URLSearchParams(location.search),sel=p.get('post');a.innerHTML=posts.map((x,i)=>`<a href="index.html?post=${x[0].replaceAll('-','')}">${x[0]}　${x[1]}</a>`).join('');function renderOne(x){c.innerHTML=`<article class="blog-post"><h2>${x[1]}</h2><div class="bmeta">${x[0]} · 槐序</div>${x[3]?`<img class="blog-photo" src="../assets/images/${x[3]}" alt="博客随手照片">`:''}<p>${x[2]}</p>${x[0]==='2008-04-13'?`<p class="small">打印店旧网址：<a href="../printshop/index.html" target="_blank">青石图文快印</a><span class="external-mark">↗</span></p>`:''}</article>`}if(sel){const x=posts.find(x=>x[0].replaceAll('-','')===sel)||posts[0];renderOne(x)}else c.innerHTML=posts.slice(0,6).map(x=>`<article class="blog-post"><h2><a href="index.html?post=${x[0].replaceAll('-','')}">${x[1]}</a></h2><div class="bmeta">${x[0]}</div><p>${x[2]}</p></article>`).join('');</script><script src="../assets/js/common.js"></script></body></html>
