const items=[
['2008-04-15','教育','七中青年教师顾槐失联，家属寻求线索','顾槐，31岁，南溪第七中学语文教师。14日早晨离开住所后未正常到校。家属称其随身带有准备寄出的书稿和少量行李，原计划近期办理工作变动。','teacher'],
['2007-06-13','教育','七中文学社完成毕业季校刊','青藤文学社完成毕业季校刊，指导教师顾槐表示，学生作品公开前应尊重作者本人修改意见。','oldgu1'],
['2006-11-12','文化','校园文学小组举办旧书交换','七中青藤文学社与本地书店联合举办旧书交换。顾槐等教师参加。','oldgu2'],
['2008-04-14','交通','城北客运线早班车雨天发生侧翻','清晨6时许，城北客运线一辆班车在湿滑路面避让时侧翻，多名乘客被分送南溪及邻市医院。','accident'],
['2008-04-16','社会','客运事故伤者信息仍有一份待核','院方称14日转院记录中曾出现手写姓名转录差错，一名女性伤者到院时没有有效证件，目前仍以临时编号登记。','accident2'],
['2008-05-02','社会','四月客运事故后续：临时编号伤者家属仍未确认','临江市医院表示，4月14日转入的一名女性伤者因严重并发症于当日夜间去世。因入院信息不足，身份核验仍在继续。','accident3'],
['2008-04-13','天气','今晚至明晨中到大雨','气象部门提醒城北道路清晨能见度较低，客运车辆注意湿滑路面。','weather'],
['2008-04-12','文化','南溪春季书市本周开幕','十余家书店参与旧书交换。','x1'],['2008-04-11','教育','七中举行青年教师公开课','语文、数学等学科开放听课。','x2'],['2008-04-10','民生','22路公交桥南段临时绕行','施工预计持续两周。','x3'],['2008-04-09','文化','地方作者短篇小说研讨会周末举行','活动在市图书馆二楼举行。','x4'],['2008-04-08','社会','江边护栏改造进入收尾','沿江步道部分路段封闭。','x5'],['2008-04-07','教育','中学生校园文学征文启动','全区中学可报送作品。','x6'],['2008-04-06','生活','春季花粉增多，医院提醒过敏人群','近期门诊相关患者增加。','x7'],['2008-04-05','交通','清明客运加开临时班次','城南客运站增开六班。','x8'],['2008-04-03','文化','旧电影院拆除方案公示','建筑经鉴定后将拆除。','x9'],['2008-04-02','教育','城区学校调整作息时间','夏季作息提前试行。','x10'],['2008-04-01','社会','三江口夜市规范经营时间','摊点集中至规定区域。','x11'],['2008-03-30','副刊','小城写作者为什么还在写','本报记者走访几位本地作者。','x12'],['2008-03-28','交通','22路末班时间暂不调整','公交公司回应读者咨询。','x13'],['2008-03-27','生活','槐树花期预计推迟一周','连续阴雨导致城区花期稍晚。','x14']];
const box=document.getElementById('content'),input=document.getElementById('news-q'),form=document.getElementById('news-search'),p=new URLSearchParams(location.search);function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function article(id){const x=items.find(i=>i[4]===id);if(!x){box.innerHTML='<p>该报道未恢复。</p>';return}let extra='';if(id==='teacher')extra=`<div class="comment-zone"><h3>读者留言</h3><div class="comment"><b>老蒋：</b> 那阵学校里传言很多。顾老师后来突然不再让一个毕业班学生去办公室，外人看起来更像闹翻了。前一年南溪教师交流站“班主任茶座”有过关于边界的讨论，现在不知道旧站还在不在。 <a href="../teachers/index.html" target="_blank">南溪教师交流站</a></div><div class="comment"><b>七中毕业生：</b> 她以前带过青藤文学社。</div><div class="comment"><b>路过：</b> 希望平安。</div></div>`;if(id==='accident')extra='<p>事故发生后，多数伤者在南溪就医，两名伤者因专科床位原因转往临江市。现场登记中有一名女性没有有效证件，只记录了随身帆布袋、书稿和大致年龄。</p>';if(id==='accident2')extra='<p>院方表示，转院名单在手写转录时出现一处同音姓名错误。警方正根据随身物品、衣着和车票来源继续核验。</p>';if(id==='accident3')extra='<p>该临时编号伤者的随身物品包括一只深色帆布袋、打印书稿、两支红笔和一张外地出版社联系卡。因早期信息错配，家属确认工作未能及时完成。</p>';box.innerHTML=`<article class="article"><p class="small"><a href="index.html?q=${encodeURIComponent(input.value)}">‹ 返回检索</a></p><h1>${esc(x[2])}</h1><div class="article-meta">${x[0]}　${x[1]}频道</div><p>${esc(x[3])}</p>${extra}</article>`}
function results(term=''){const hiddenOnBrowse=new Set(['teacher','accident','accident2','accident3']);let r=term?items:items.filter(i=>!hiddenOnBrowse.has(i[4])).slice(0,12);if(term){const ws=term.trim().split(/\s+/);r=items.filter(i=>ws.every(w=>i.slice(0,4).join(' ').includes(w))||ws.some(w=>w.length>1&&i.slice(0,4).join(' ').includes(w)));if(['教育','交通','文化','副刊','社会','生活','民生'].includes(term.trim()))r=r.filter(i=>!hiddenOnBrowse.has(i[4]));}box.innerHTML=`<section class="search-results"><h2>${term?'检索：'+esc(term):'近期旧闻'} <span class="small muted">${r.length} 条</span></h2>${r.map(x=>`<article class="result"><h3><a href="index.html?article=${x[4]}&q=${encodeURIComponent(term)}">${esc(x[2])}</a></h3><div class="info">${x[0]} · ${x[1]}</div><p>${esc(x[3])}</p></article>`).join('')}</section>`}
form.addEventListener('submit',e=>{e.preventDefault();location.href='index.html?q='+encodeURIComponent(input.value)});const q=p.get('q')||'';input.value=q;p.get('article')?article(p.get('article')):results(q);
</script><script src="../assets/js/common.js"></script></body></html>
