<script>const items=[["2008-04-15", "教育", "七中青年教师顾槐失联，家属寻求线索", "顾槐，31岁，南溪第七中学语文教师。14日早晨离开住所后未正常到校，家属和学校正在寻找。", "teacher"], ["2007-06-13", "教育", "七中文学社完成毕业季校刊，指导教师顾槐谈学生写作", "七中青藤文学社本周完成毕业季校刊，指导教师顾槐表示，学生作品公开前应尊重作者本人的修改意见。", "oldgu1"], ["2006-11-12", "文化", "校园文学小组举办旧书交换，顾槐等教师参加", "活动由学生自主组织，教师只负责场地和安全。", "oldgu2"], ["2008-04-14", "交通", "城北客运线早班车雨天发生侧翻，数名乘客送医", "事故发生于清晨，伤者分送南溪及邻市医院，一名女性乘客最初登记信息不全。", "accident"], ["2008-04-16", "社会", "客运事故伤者身份登记完成，仍有一份信息待核", "院方称转院过程中曾出现姓名转录差错，家属核验工作仍在进行。", "accident2"], ["2008-04-13", "天气", "今晚至明晨中到大雨，城北道路注意积水", "气象部门提醒清晨出行车辆降低车速。", "weather"], ["2008-04-12", "文化", "南溪春季书市本周开幕", "本地十余家书店参与旧书交换。", "x1"], ["2008-04-11", "教育", "七中举行青年教师公开课", "语文、数学等学科开放听课。", "x2"], ["2008-04-10", "民生", "22路公交桥南段临时绕行", "施工预计持续两周。", "x3"], ["2008-04-09", "文化", "地方作者短篇小说研讨会周末举行", "活动在市图书馆二楼举行。", "x4"], ["2008-04-08", "社会", "江边护栏改造进入收尾", "沿江步道部分路段封闭。", "x5"], ["2008-04-07", "教育", "中学生校园文学征文启动", "全区中学可报送作品。", "x6"], ["2008-04-06", "生活", "春季花粉增多，医院提醒过敏人群", "近期门诊相关患者增加。", "x7"], ["2008-04-05", "交通", "清明客运加开临时班次", "城南客运站增开六班。", "x8"], ["2008-04-03", "文化", "旧电影院拆除方案公示", "建筑经鉴定后将拆除。", "x9"], ["2008-04-02", "教育", "城区学校调整作息时间", "夏季作息提前试行。", "x10"], ["2008-04-01", "社会", "三江口夜市规范经营时间", "摊点集中至规定区域。", "x11"], ["2008-03-30", "副刊", "小城写作者为什么还在写", "本报记者走访几位本地作者。", "x12"], ["2008-03-28", "交通", "22路末班时间暂不调整", "公交公司回应读者咨询。", "x13"], ["2008-03-27", "生活", "槐树花期预计推迟一周", "连续阴雨导致城区花期稍晚。", "x14"]];const box=document.getElementById('content'),qInput=document.getElementById('news-q');const p=new URLSearchParams(location.search),article=p.get('article'),q=p.get('q')||'';qInput.value=q;function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function showArticle(id){const x=items.find(i=>i[4]===id);if(!x){box.innerHTML='<p>该报道未在旧站恢复。</p>';return}let extra='';if(id==='teacher')extra=`<div class="comment-zone"><h3>读者留言（3）</h3><div class="comment"><b>老蒋：</b> 那阵学校很难看。有人说话越来越难听，事情不是新闻里猜的那样。以前我们教师交流站还讨论过“和学生保持边界”这件事。旧帖应该还在：<a href="../teachers/index.html?thread=boundary" target="_blank">南溪教师交流站 / 班主任茶座</a><span class="external-mark">↗</span></div><div class="comment"><b>路过：</b> 希望人平安。</div><div class="comment"><b>七中毕业生：</b> 顾老师以前带文学社。</div></div>`;if(id==='accident')extra=`<p>交警部门通报，车辆在湿滑路面避让时侧翻。多数伤者在南溪就医，两名伤者因床位与专科原因转往临江市。最初现场登记中，一名女性只记录了随身物品和大致年龄，未能及时核对有效证件。</p><p class="muted">后续：<a href="index.html?article=accident2">伤者身份登记完成，仍有一份信息待核</a></p>`;if(id==='accident2')extra=`<p>院方表示，4月14日转院的伤者名单在手写转录时出现一处同音姓名错误，随后根据家属提供的信息陆续核对。由于一名女性伤者到院时无有效证件，相关信息曾长期以临时编号留存。</p><p>该伤者后因严重并发症去世。院方称已按当年程序向有关部门报备。</p>`;box.innerHTML=`<article class="article"><p class="small"><a href="index.html?q=${encodeURIComponent(q)}">‹ 返回搜索结果</a></p><h1>${esc(x[2])}</h1><div class="article-meta">${x[0]}　来源：南溪生活报 · ${x[1]}频道</div><p>${esc(x[3])}</p>${extra}</article>`}function showResults(term){let r=items;if(term)r=items.filter(i=>i.slice(0,4).join(' ').includes(term));if(!r.length)r=items.filter(i=>term.split(/\s+/).some(w=>w&&i.slice(0,4).join(' ').includes(w)));box.innerHTML=`<section class="search-results"><h2>${term?'搜索：'+esc(term):'最新报道'} <span class="small muted">(${r.length})</span></h2>`+r.map(x=>`<article class="result"><h3><a href="index.html?article=${x[4]}&q=${encodeURIComponent(term)}">${esc(x[2])}</a></h3><div class="info">${x[0]} · ${x[1]}</div><p>${esc(x[3])}</p></article>`).join('')+'</section>'}if(article)showArticle(article);else showResults(q);</script><script src="../assets/js/common.js"></script></body></html>
